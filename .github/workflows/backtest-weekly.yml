# Weekly backtest (spec 7.2, FR-HIST-03). Sunday 01:00 UTC = 09:00 MYT.
name: backtest-weekly

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal      # never runs at the same time as the daily job (both commit data/)
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -q -r python/requirements.txt
      - name: Run backtest
        run: python python/backtest.py
      - name: Commit data/backtest.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Backtest update $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d') MYT"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
